[package]
name = "clover-bot-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dotenvy = "0.15"
chrono = "0.4"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
